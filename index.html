      {t:`Add the prices with SUM and divide by 7.`,
       why:`There are 6 prices (B2:B7), not 7. Counting by hand is easy to get wrong; AVERAGE counts for you.`},
      {t:`Type <code>=AVERAGE</code> and press Enter.`,
       why:`A function needs its arguments in brackets. Without (B2:B7), Excel shows an error message and won't accept it.`},
    ]},
  { type:'formula', topic:'Percentages', title:'Better than last month?',
    say:`Last month we took the amount in J5. Did we grow?`,
    q:`In <b>J7</b>, calculate the percentage change from last month (J5) to this month (E8): (new − old) ÷ old.`,
    target:'J7', ref:'=(E8-J5)/J5', fmt:'pct',
    prefill:{E8:'=SUM(E2:E7)'},
    lesson:`Percentage change = (new − old) ÷ old. The brackets matter, because the subtraction has to happen before the division. A positive result means growth: revenue went up 5%. <code>=E8/J5-1</code> gives the same answer.`,
    diag:[
      {re:/^=E8-J5\/J5$/, msg:`Division happens first, so Excel calculated J5/J5 (= 1) and took it from E8. Put E8-J5 in brackets.`},
      {re:/^=\(J5-E8\)\/J5$/, msg:`Old minus new flips the sign, so growth looks like a fall. Use new minus old: (E8-J5)/J5.`},
      {re:/^=E8\/J5$/, msg:`This gives this month as a share of last month (105%), not the change. Subtract 1, or use (E8-J5)/J5.`},
      {re:/\/E8$/, msg:`Divide by the old value (J5), not the new one. Percentage change is always measured against where you started.`},
    ]},
  ]
},
{
  id:'cust', tab:'Customers', company:'Northwind Subscriptions', file:'customer_export_merged.xlsx',
  who:'Priya Nair', role:'Customer Success Lead', ini:'PN',
  story:`We exported our customer list from three old systems and it's a mess: random capitals, extra spaces, mixed formats. Our email campaign goes out on Friday. Can you clean it up so every name and email is consistent?`,
  skills:['Why consistency matters','TRIM','PROPER, UPPER & LOWER','LEFT, RIGHT & MID','LEN','Joining text with &','Paste as values'],
  cells: custSheet,
  tasks:[
  { type:'mcq', topic:'Inconsistent data', title:'The missing customers',
    say:`Our report counts 40 customers in the North region, but I know there are 52. When I checked with LEN, some Region cells are 6 characters long, but "North" only has 5.`,
    q:`What's the most likely cause?`,
    opts:[
      {t:`Some cells contain "North " with a trailing space, which Excel treats as a different value.`, ok:true,
       why:`To Excel, "North" and "North " are two different text values, so filters, counts and lookups split them into separate groups. The extra character is invisible, which is why LEN is such a useful check. TRIM removes it. In this sheet, extra spaces are shown as orange dots so you can see them.`},
      {t:`Excel's filter is case-sensitive, so "north" and "North" are counted separately.`,
       why:`Excel's filters and comparisons ignore letter case. Capitals make data look untidy, but a 6-character "North" points to an extra character, not a capital letter.`},
      {t:`The report is filtering the wrong column.`,
       why:`That can happen, but it doesn't explain why some cells are 6 characters long. The length is the clue.`},
      {t:`LEN counts the cell border as a character.`,
       why:`LEN counts only the characters in the value. Formatting like borders, colours or fonts is never counted.`},
    ]},
  { type:'formula', topic:'TRIM & PROPER', title:'Clean names',
    say:`Names first. I want "John Smith", not "  john SMITH".`,
    q:`In <b>E2</b>, write one formula that removes the extra spaces from A2 <i>and</i> capitalises the first letter of each word.`,
    target:'E2:E7', ref:'=PROPER(TRIM(A2))', cs:true,
    lesson:`TRIM removes spaces at both ends and squeezes double spaces in the middle down to one. PROPER capitalises the first letter of each word. Nesting them, <code>PROPER(TRIM(A2))</code>, does both: Excel works from the inside out. PROPER even handles O'Connor correctly.`,
    diag:[
      {re:/^=TRIM\(A2\)$/, msg:`The spaces are gone, but the capitals are still messy ("john SMITH"). Wrap it in PROPER.`},
      {re:/^=PROPER\(A2\)$/, msg:`The capitals are fixed, but the extra spaces are still there (look for the orange dots). Put TRIM inside: PROPER(TRIM(A2)).`},
      {re:/UPPER/, msg:`UPPER turns every letter into a capital (JOHN SMITH). Names need just the first letter of each word capitalised: that's PROPER.`},
      {re:/LOWER/, msg:`LOWER makes everything small letters (john smith). For names you want PROPER.`},
    ]},
  { type:'formula', topic:'UPPER & LOWER', title:'Clean emails',
    say:`Emails next. The same person shows up as John.Smith@Mail.COM and john.smith@mail.com, so we email them twice.`,
    q:`In <b>F2</b>, make the email in B2 all lowercase with no extra spaces.`,
    target:'F2:F7', ref:'=LOWER(TRIM(B2))', cs:true,
    lesson:`Email addresses aren't case-sensitive, so the usual standard is all lowercase. <code>LOWER(TRIM(B2))</code> removes stray spaces and lowers every letter, so duplicates now match exactly.`,
    diag:[
      {re:/PROPER/, msg:`PROPER capitalises each word, giving John.Smith@Mail.Com. Emails should be all lowercase: use LOWER.`},
      {re:/UPPER/, msg:`UPPER gives JOHN.SMITH@MAIL.COM. The standard for emails is all lowercase: use LOWER.`},
      {re:/^=LOWER\(B2\)$/, msg:`Lowercase is right, but rows 2 and 5 have spaces before or after the address. Add TRIM inside LOWER.`},
    ]},
  { type:'formula', topic:'LEFT, RIGHT & MID', title:'Signup year',
    say:`Our Customer IDs look like US-2023-0153. The middle part is the year they signed up. I'd like it in its own column.`,
    q:`In <b>G2</b>, pull the 4-digit year out of the ID in C2.`,
    target:'G2:G7', ref:'=MID(C2,4,4)', loose:true,
    lesson:`<code>MID(text, start, length)</code> takes characters from the middle. In US-2023-0153 the year starts at character 4 (U is 1, S is 2, the dash is 3) and is 4 characters long. MID returns text ("2023"); wrap it in VALUE() if you need a number for calculations.`,
    diag:[
      {re:/^=LEFT\(C2/, msg:`LEFT takes characters from the start, which gives the country code (US). The year is in the middle: use MID.`},
      {re:/^=RIGHT\(C2/, msg:`RIGHT takes characters from the end: that's the sequence number (0153). For the middle, use MID.`},
      {re:/MID\(C2,3,/, msg:`Close! Starting at 3 picks up the dash. Count again: U is 1, S is 2, the dash is 3, so the year starts at 4.`},
      {re:/MID\(C2,5,/, msg:`Starting at 5 skips the first digit of the year. Count: U is 1, S is 2, the dash is 3, so the year starts at 4.`},
    ]},
  { type:'mcq', topic:'LEN', title:'Proving the spaces',
    say:`My manager doesn't believe some names have hidden spaces. How can I prove it for cell A2?`,
    q:`Which check proves A2 has extra spaces?`,
    opts:[
      {t:`Compare <code>=LEN(A2)</code> with <code>=LEN(TRIM(A2))</code>. If the first number is bigger, there were extra spaces.`, ok:true,
       why:`LEN counts every character, spaces included. TRIM removes the extra ones, so if the trimmed length is shorter, the difference is exactly how many extra spaces there were. For "  john SMITH" that's 12 vs 10.`},
      {t:`Look at the cell carefully.`,
       why:`Trailing spaces are completely invisible, and leading spaces look like normal alignment. You can't reliably see them.`},
      {t:`If <code>=TRIM(A2)=A2</code> returns TRUE, there are extra spaces.`,
       why:`This is backwards. TRUE means TRIM changed nothing, so there were no extra spaces. FALSE would prove they exist.`},
      {t:`Use <code>=UPPER(A2)</code>.`,
       why:`UPPER changes letters to capitals. It tells you nothing about spaces.`},
    ]},
  { type:'formula', topic:'Joining text', title:'Mailing label',
    say:`For the campaign tool I need one label per customer, like "John Smith (US)".`,
    q:`In <b>H2</b>, join the clean name in E2, a space, and the 2-letter country code from C2 in brackets. Expected for row 2: John Smith (US)`,
    target:'H2:H7', ref:'=E2&" ("&LEFT(C2,2)&")"', cs:true,
    prefill:{},
    lesson:`The & operator joins pieces of text. Text you type yourself (the space and the brackets) goes inside double quotes: <code>" ("</code>. <code>CONCAT(E2," (",LEFT(C2,2),")")</code> does the same job.`,
    diag:[
      {re:/A2/, msg:`A2 is the raw, messy name. Use the clean name you already made in E2.`},
      {re:/\(C2\)|&C2&/, msg:`C2 is the whole ID (US-2023-0153). You only need the first 2 characters: LEFT(C2,2).`},
    ]},
  { type:'mcq', topic:'Paste as values', title:'Removing the raw columns',
    say:`Now I want to delete the messy columns A and B and keep only the clean names and emails.`,
    q:`What should Priya do first?`,
    opts:[
      {t:`Copy the clean columns, then Paste Special > Values over them. Then delete A and B.`, ok:true,
       why:`The clean columns are formulas that read from A and B. Pasting as values swaps each formula for its result, so the clean text no longer depends on the raw data. After that, deleting A and B is safe.`},
      {t:`Delete columns A and B straight away.`,
       why:`The formulas in the clean columns still point at A and B. Once those columns are gone, every clean cell turns into #REF!, meaning "this reference no longer exists".`},
      {t:`Hide columns A and B instead.`,
       why:`Hiding is safe, but it isn't what Priya asked for. The messy data stays in the file and anyone can unhide it. It's fine as a temporary step, not as the clean-up.`},
      {t:`Cut the clean columns and paste them over A and B.`,
       why:`Cutting moves the formulas without changing their references, so they'd now sit in the very cells they read from. That creates circular references.`},
    ]},
  ]
},
{
  id:'hr', tab:'HR', company:'Greenfield Logistics', file:'team_review_2026.xlsx',
  who:'Marcus Webb', role:'HR Manager', ini:'MW',
  story:`Year-end reviews are coming. I need years of service, review dates, bonus decisions and ratings for the team, plus how many working days we have left this year. In this sheet, today is Thursday 1 October 2026.`,
  skills:['TODAY & fixed dates','DATEDIF','EOMONTH','NETWORKDAYS','IF','IFS','AND & OR'],
  cells: hrSheet,
  tasks:[
  { type:'mcq', topic:'Dynamic dates', title:'Date signed',
    say:`I'm signing a contract today. The "Date signed" cell must show today's date and never change after that.`,
    q:`What should Marcus put in the cell?`,
    opts:[
      {t:`Press Ctrl + ; (semicolon).`, ok:true,
       why:`Ctrl + ; types today's date as a fixed value. It stays the same forever, which is what a signing date needs. Ctrl + Shift + ; does the same for the current time.`},
      {t:`<code>=TODAY()</code>`,
       why:`TODAY() is dynamic: it recalculates every time the file opens. Tomorrow the "signing date" would say tomorrow. Use it for things that should move, like "days until the deadline".`},
      {t:`<code>=NOW()</code>`,
       why:`NOW() is also dynamic, and includes the time. It changes every time Excel recalculates.`},
      {t:`<code>=DATE(TODAY())</code>`,
       why:`DATE needs three arguments (year, month, day), so this gives an error. Even fixed, it would still be dynamic because of TODAY().`},
    ]},
  { type:'formula', topic:'Date calculations', title:'Years of service',
    say:`How many complete years has each person worked here?`,
    q:`In <b>F2</b>, calculate complete years between the start date in B2 and today. Tip: <code>DATEDIF(start, end, "Y")</code>.`,
    target:'F2:F7', ref:'=DATEDIF(B2,TODAY(),"Y")', fmt:'int',
    lesson:`<code>DATEDIF(start, end, "Y")</code> counts complete years. With TODAY() as the end date, it updates every day, so the sheet stays right next year without edits. Subtracting dates gives days; dividing by 365 looks close, but leap years make it drift, as Farid's row shows (2 years and 364 days).`,
    diag:[
      {re:/^=TODAY\(\)-B2$/, msg:`Subtracting two dates gives the number of days between them, not years. Use DATEDIF(B2,TODAY(),"Y").`},
      {re:/\/365/, msg:`Dividing days by 365 ignores leap years. Farid started on 2 Oct 2023: that's 1,095 days, and 1,095 ÷ 365 = exactly 3, but his third anniversary is tomorrow. DATEDIF counts real calendar years.`},
      {re:/DATEDIF\(TODAY\(\),B2/, msg:`The start date has to come first: DATEDIF(B2, TODAY(), "Y"). With the dates the wrong way round, DATEDIF returns #NUM!.`},
    ]},
  { type:'formula', topic:'Working days', title:'Working days left',
    say:`Finance wants to know how many working days are left this year, counting today. Weekends don't count, and nor do the company holidays in L2:L4.`,
    q:`In <b>L7</b>, count the working days from today to 31 December 2026, excluding the holidays in L2:L4.`,
    target:'L7', ref:'=NETWORKDAYS(TODAY(),DATE(2026,12,31),L2:L4)', fmt:'int', mustUse:'NETWORKDAYS',
    mustUseMsg:`The number is right, but use NETWORKDAYS so it stays right tomorrow and when holidays change.`,
    lesson:`<code>NETWORKDAYS(start, end, holidays)</code> counts Monday-to-Friday days between two dates, including both ends, then removes any dates listed in the holiday range. With TODAY() as the start, the count drops by itself each working day.`,
    diag:[
      {re:/^=NETWORKDAYS\(TODAY\(\),DATE\(2026,12,31\)\)$/, msg:`Close: weekends are excluded, but the 3 company holidays still count as working days. Add L2:L4 as the third argument.`},
      {re:/^=DATE\(2026,12,31\)-TODAY\(\)/, msg:`This counts calendar days, weekends included. Use NETWORKDAYS to count only working days.`},
    ]},
  { type:'formula', topic:'Date calculations', title:'Review due date',
    say:`Each person's review is due at the end of the month, six months after their start date.`,
    q:`In <b>G2</b>, find the last day of the month that's 6 months after the start date in B2.`,
    target:'G2:G7', ref:'=EOMONTH(B2,6)', fmt:'date',
    lesson:`<code>EOMONTH(date, months)</code> moves forward the given number of months and returns the last day of that month. It handles 28-, 30- and 31-day months and leap years for you. The cell needs a date format, otherwise you'd see a serial number like 43830.`,
    diag:[
      {re:/EDATE/, msg:`EDATE moves forward 6 months but keeps the same day of the month (17 Dec, not 31 Dec). Marcus wants the end of the month: that's EOMONTH.`},
      {re:/\+18[0-3]/, msg:`Adding about 180 days assumes every month has 30 days, so you land on the wrong day. Use EOMONTH(B2,6).`},
    ]},
  { type:'formula', topic:'IF', title:'Bonus decision',
    say:`Anyone with a score of 80 or above gets a bonus.`,
    q:`In <b>H2</b>, show <b>Bonus</b> if the score in D2 is 80 or more, otherwise <b>No bonus</b>.`,
    target:'H2:H7', ref:'=IF(D2>=80,"Bonus","No bonus")',
    lesson:`<code>IF(test, value if true, value if false)</code>. The test <code>D2>=80</code> includes exactly 80 because of the = sign. Text results always go in double quotes.`,
    diag:[
      {re:/D2>80/, msg:`Chen Mei scored exactly 80. With > she's left out; "80 or above" needs >=.`},
      {re:/D2<80/, msg:`Check which way round the result is: when D2<80 is TRUE, the person should get "No bonus", so that has to be the second argument.`},
    ]},
  { type:'formula', topic:'IFS', title:'Performance rating',
    say:`Ratings: 90+ is Excellent, 75 to 89 is Good, 60 to 74 is Fair, and below 60 is Needs support.`,
    q:`In <b>I2</b>, give each person their rating based on D2. IFS or nested IF both work.`,
    target:'I2:I7', ref:'=IFS(D2>=90,"Excellent",D2>=75,"Good",D2>=60,"Fair",TRUE,"Needs support")',
    lesson:`IFS checks each test in order and returns the result for the first one that's TRUE. That's why order matters: start with the highest band. The final <code>TRUE,"Needs support"</code> catches everything else, so a score under 60 doesn't end up as #N/A.`,
    diag:[
      {re:/^=IFS\(D2>=60/, msg:`IFS stops at the first test that's TRUE. A score of 92 is also >= 60, so everyone above 60 gets "Fair". Check the highest band first: D2>=90.`},
      {re:/^=IF\(D2>=60/, msg:`The first test catches too much: 92 is also >= 60. Start with the highest band (D2>=90) and work down.`},
    ]},
  { type:'formula', topic:'AND & OR', title:'Remote work',
    say:`Remote work is allowed if someone has at least 2 years of service AND has taken 10 or fewer days of leave.`,
    q:`In <b>J2</b>, show <b>Yes</b> or <b>No</b>. Years of service is in F2, leave taken is in C2.`,
    target:'J2:J7', ref:'=IF(AND(F2>=2,C2<=10),"Yes","No")',
    lesson:`AND returns TRUE only when every condition is true. Inside IF it lets one test combine several rules. Ben and Farid have exactly 2 years, so the >= matters.`,
    diag:[
      {re:/OR\(/, msg:`OR is TRUE if any one condition is true, so almost everyone gets Yes. Marcus needs both rules to pass: use AND.`},
      {re:/F2>2[,)]/, msg:`Ben and Farid have exactly 2 years. "At least 2" needs >=.`},
      {re:/C2<10[,)]/, msg:`"10 or fewer" needs <=10, so that 10 days is still allowed.`},
    ]},
  { type:'mcq', topic:'AND & OR', title:'Flag for check-in',
    say:`Last one. I want to flag anyone who works in Sales OR has a score under 60.`,
    q:`Which formula should go in row 2?`,
    opts:[
      {t:`<code>=IF(OR(E2="Sales",D2&lt;60),"Flag","")</code>`, ok:true,
       why:`OR is TRUE if at least one condition is true, so both Sales staff and anyone under 60 get flagged. The empty quotes "" leave the cell blank for everyone else.`},
      {t:`<code>=IF(AND(E2="Sales",D2&lt;60),"Flag","")</code>`,
       why:`AND needs both conditions: only a Sales person with a score under 60 would be flagged. Nobody on this team matches, so nobody gets flagged.`},
      {t:`<code>=IF(OR(E2=Sales,D2&lt;60),"Flag","")</code>`,
       why:`Sales has no quotes, so Excel looks for something named Sales, can't find it, and returns #NAME?. Text in a formula always needs double quotes.`},
      {t:`<code>=OR(E2="Sales",D2&lt;60)</code>`,
       why:`This test works, but it shows TRUE or FALSE instead of "Flag". Wrapping it in IF lets you choose a clear label.`},
    ]},
  ]
},
{
  id:'summit', tab:'Summit', company:'Asia Library Summit', file:'summit_registrations.xlsx',
  who:'Rina Kamal', role:'Events Coordinator', ini:'RK',
  story:`Our summit starts tomorrow and the name badges go to the printer tonight. Registrations came through an online form, so the names are a mess. I already split most of them into Title, First name and Last name with Text to Columns, but one speaker registered late and her full name is still in one cell, and another speaker has just signed up. Can you finish the list so every badge looks the same?`,
  skills:['LEFT, MID & RIGHT','Text to Columns','TEXTSPLIT','PROPER & UPPER','TRIM','CONCAT & CONCATENATE','TEXTJOIN','Regional settings'],
  cells: sheet([
    ['Full name (as typed)','Title','First name','Last name','Country (raw)','First (clean)','Last (badge)','Country','Badge text'],
    ['Professor Nadia Hassan','','','','my'],
    ['Dr aisyah RAHMAN','Dr','aisyah','RAHMAN','my '],
    ['Mr Daniel lim','Mr','Daniel','lim','sg'],
    ['Ms PRIYA menon','Ms','PRIYA','menon',' IN'],
    ['Dr farah TAN','Dr','farah','TAN','my'],
    ['Prof ahmad ZAKARIA','Prof','ahmad','ZAKARIA','id'],
  ], {}, { A9:{v:'Dr Kevin Ong'}, A8:{v:'Late registration ↓',h:true}, A11:{v:'Welcome slide',h:true} }),
  tasks:[
  { type:'mcq', topic:'Why split text?', title:'One cell, three facts',
    say:`Why can't we just keep "Professor Nadia Hassan" in one cell? It looks fine to me.`,
    q:`What's the main benefit of splitting a full name into Title, First name and Last name columns?`,
    opts:[
      {t:`You can filter, count and sort by each part, for example count all the professors, or start emails with "Dear Nadia".`, ok:true,
       why:`When the title is part of a longer entry, a filter on the Title column can't find it. In separate columns, each part can be filtered, counted, sorted and reused on its own.`},
      {t:`It makes the file smaller.`,
       why:`Splitting actually adds columns. The benefit is being able to analyse and reuse each part, not saving space.`},
      {t:`Excel can't store more than two words in one cell.`,
       why:`A cell can hold thousands of characters. Splitting is about analysis, not a storage limit.`},
      {t:`It fixes the capital letters automatically.`,
       why:`Splitting moves text into new columns exactly as it was typed. Fixing capitals needs PROPER, UPPER or LOWER.`},
    ]},
  { type:'formula', topic:'LEFT', title:'Pull out the title',
    say:`Let's do the late entry by hand. First, the title.`,
    q:`In <b>B2</b>, use LEFT to take the first <b>9</b> characters of A2 ("Professor").`,
    target:'B2', ref:'=LEFT(A2,9)', cs:true,
    lesson:`<code>LEFT(text, number of characters)</code> takes characters from the start of the entry. "Professor" is 9 letters, so <code>=LEFT(A2,9)</code>. Depending on your computer's region, Excel may want a semicolon instead of a comma: <code>=LEFT(A2;9)</code>. This game accepts both.`,
    diag:[
      {re:/LEFT\(A2,10\)/, msg:`10 characters includes the space after "Professor". The space is invisible, but it's there, and it would break a filter for "Professor". Use 9.`},
      {re:/^=RIGHT\(A2/, msg:`RIGHT counts from the end of the entry, which is where the last name is. The title is at the start: use LEFT.`},
      {re:/^=LEFT\(A2\)$/, msg:`Without a number, LEFT returns only 1 character ("P"). Add how many characters you want: 9.`},
    ]},
  { type:'formula', topic:'MID', title:'Pull out the first name',
    say:`Now her first name, Nadia. It's in the middle, so it's trickier.`,
    q:`In <b>C2</b>, use MID to extract "Nadia" from A2. Count carefully: "Professor" is characters 1–9 and the space is character 10.`,
    target:'C2', ref:'=MID(A2,11,5)', cs:true,
    lesson:`<code>MID(text, start position, number of characters)</code>. "Nadia" starts at character 11 (9 letters + 1 space + 1) and is 5 characters long. MID is the only one of the three that needs a start position, because the text you want isn't at either end.`,
    diag:[
      {re:/MID\(A2,10,/, msg:`Character 10 is the space after "Professor", so the result starts with a space. Start at 11.`},
      {re:/MID\(A2,11,6\)/, msg:`6 characters picks up the space after "Nadia". You can't see it, but "Nadia " won't match "Nadia". Use 5.`},
      {re:/MID\(A2,5,11\)|MID\(A2,5,/, msg:`The arguments are in the wrong order. MID needs the start position second and the number of characters third: MID(A2, 11, 5).`},
      {re:/^=LEFT\(A2|^=RIGHT\(A2/, msg:`LEFT and RIGHT only take text from the ends. "Nadia" is in the middle, so use MID.`},
    ]},
  { type:'formula', topic:'RIGHT', title:'Pull out the last name',
    say:`And the last name.`,
    q:`In <b>D2</b>, use RIGHT to take the last 6 characters of A2 ("Hassan").`,
    target:'D2', ref:'=RIGHT(A2,6)', cs:true,
    lesson:`<code>RIGHT(text, number of characters)</code> counts backwards from the end of the entry. "Hassan" is the last 6 characters. Now the late entry matches the other rows.`,
    diag:[
      {re:/RIGHT\(A2,7\)/, msg:`7 characters includes the space before "Hassan". Use 6.`},
      {re:/^=LEFT\(A2/, msg:`LEFT counts from the start of the entry. The last name is at the end: use RIGHT.`},
    ]},
  { type:'mcq', topic:'MID', title:'What does each number mean?',
    say:`My colleague asked me what the 11 and the 5 in your MID formula mean.`,
    q:`In <code>=MID(A2,11,5)</code>, what do 11 and 5 mean?`,
    opts:[
      {t:`Start at character 11, then take 5 characters.`, ok:true,
       why:`MID's second argument is where to start counting, and the third is how many characters to return from there. Spaces count as characters.`},
      {t:`Take characters 5 to 11.`,
       why:`MID doesn't take a "from–to" range. The first number is the start position, the second is how many characters to take.`},
      {t:`Take 11 characters, starting at character 5.`,
       why:`That swaps the two arguments. In MID, the start position always comes before the number of characters.`},
      {t:`Row 11, column 5.`,
       why:`MID works inside one text entry. The numbers count characters, not rows or columns.`},
    ]},
  { type:'mcq', topic:'Text to Columns', title:'2,000 more names',
    say:`Next year we expect 2,000 registrations, with names of every length. Do I write LEFT, MID and RIGHT for each one?`,
    q:`What's the most practical way to split 2,000 full names into separate columns?`,
    opts:[
      {t:`Use Data > Text to Columns, and split by the space character.`, ok:true,
       why:`Text to Columns splits every entry at a delimiter (here a space) in one go, whatever the length of each name. LEFT, MID and RIGHT with fixed numbers only work when every entry has the same length. Watch out for names with more than one space, such as "Wei Jie Tan", which would split into extra columns.`},
      {t:`Write a separate LEFT, MID and RIGHT formula for every row, counting the characters each time.`,
       why:`It would work, but with names of different lengths you'd need different numbers in each row. That's slow and easy to get wrong across 2,000 rows.`},
      {t:`Copy the LEFT(A2,9) formula down the whole column.`,
       why:`9 characters is right for "Professor", but "Dr" is 2 characters and "Mr" is 2. Fixed numbers break as soon as lengths change.`},
      {t:`Use TRIM.`,
       why:`TRIM only removes extra spaces. It doesn't split text into columns.`},
    ]},
  { type:'mcq', topic:'Text to Columns', title:'Inside the wizard',
    say:`I opened Data > Text to Columns on the Full name column. The wizard asks me to choose a data type first.`,
    q:`To split names like "Dr farah TAN" into three columns, what should Rina choose?`,
    opts:[
      {t:`Delimited, with Space as the delimiter. Then set a Destination so the original column isn't overwritten.`, ok:true,
       why:`The parts are separated by a character (a space), so Delimited is right. By default the wizard writes the results over the original column and the columns to its right, so pick an empty Destination cell (or insert empty columns first) to keep the original names.`},
      {t:`Fixed width, with a break after character 3.`,
       why:`Fixed width only works when every part starts at the same position in every entry. "Dr" is 2 characters but "Prof" is 4, so the breaks would land in the wrong places.`},
      {t:`Delimited, with Comma as the delimiter.`,
       why:`There are no commas in these names, so nothing would be split. The words are separated by spaces.`},
      {t:`Delimited, with Tab as the delimiter.`,
       why:`Tab is the default for data pasted from some systems, but these names are separated by spaces.`},
    ]},
  { type:'formula', topic:'TEXTSPLIT', title:'A split that updates itself',
    say:`Another speaker just registered: "Dr Kevin Ong" in A9. This time, use a formula instead of the wizard.`,
    q:`In <b>B9</b>, use TEXTSPLIT to split A9 at each space. One formula fills B9, C9 and D9.`,
    target:'B9', spillCells:['C9','D9'], ref:'=TEXTSPLIT(A9," ")', cs:true,
    lesson:`<code>TEXTSPLIT(text, delimiter)</code> returns several values at once, and Excel <b>spills</b> them into the cells to the right (highlighted). It's newer than Text to Columns (Excel 365 and Excel 2024). If any of those cells already holds something, you get #SPILL! instead.`,
    diag:[
      {re:/TEXTSPLIT\(A9\)$/, msg:`TEXTSPLIT needs a second argument: the delimiter to split at. Here that's a space, written as " ".`},
      {re:/TEXTSPLIT\(A9,""\)/, msg:`The delimiter is empty. Put a space between the quotes: " ".`},
      {re:/TEXTSPLIT\(A9,","\)/, msg:`There are no commas in "Dr Kevin Ong", so nothing is split. The words are separated by spaces: " ".`},
      {re:/^=LEFT|^=MID|^=RIGHT/, msg:`That gets one part at a time. TEXTSPLIT can return all three parts with one formula.`},
    ]},
  { type:'mcq', topic:'Text to Columns vs TEXTSPLIT', title:'Which one updates?',
    say:`Kevin emailed: his surname is actually "Ong-Lee". I'll fix it in A9. What happens to the split columns?`,
    q:`After Rina edits A9, which split updates by itself?`,
    opts:[
      {t:`The TEXTSPLIT formula in row 9. Text to Columns results (rows 3–7) are fixed values and won't change.`, ok:true,
       why:`TEXTSPLIT is a formula, so it recalculates whenever its source changes. Text to Columns is a one-off action that writes plain values, so to update it you'd have to run the wizard again.`},
      {t:`Both update automatically.`,
       why:`Text to Columns doesn't leave formulas behind, only typed values. They won't change when the source changes.`},
      {t:`Only the Text to Columns results update.`,
       why:`It's the other way round. The wizard writes fixed values; the formula is what updates.`},
      {t:`Neither. You must run both again.`,
       why:`TEXTSPLIT updates by itself. Only Text to Columns needs to be run again.`},
    ]},
  { type:'formula', topic:'PROPER', title:'Tidy first names',
    say:`The first names are a mix: "aisyah", "PRIYA", "farah". Badges need them looking normal.`,
    q:`In <b>F2</b>, make the first name in C2 start with a capital letter and continue in lowercase. It fills down to F7.`,
    target:'F2:F7', ref:'=PROPER(C2)', cs:true,
    lesson:`<code>PROPER</code> capitalises the first letter of each word and makes the rest lowercase: "aisyah" becomes "Aisyah", and "PRIYA" becomes "Priya". It needs only one argument: the cell to work on.`,
    diag:[
      {re:/UPPER/, msg:`UPPER makes every letter a capital (AISYAH). For first names, you want only the first letter capitalised: PROPER.`},
      {re:/LOWER/, msg:`LOWER makes everything lowercase (aisyah). Names need a capital at the start: PROPER.`},
      {re:/\(A2\)/, msg:`A2 is the full name. Use the first name in column C.`},
    ]},
  { type:'formula', topic:'UPPER', title:'Surnames in capitals',
    say:`House style for our badges: surnames in capital letters, so they're easy to read across a room.`,
    q:`In <b>G2</b>, turn the last name in D2 into all capital letters.`,
    target:'G2:G7', ref:'=UPPER(D2)', cs:true,
    lesson:`<code>UPPER</code> converts every letter to a capital: "lim" becomes "LIM". Entries that were already in capitals, like "RAHMAN", stay the same, so the column is now consistent.`,
    diag:[
      {re:/PROPER/, msg:`PROPER gives "Hassan" and "Lim". The badge style needs the whole surname in capitals: UPPER.`},
    ]},
  { type:'formula', topic:'TRIM & UPPER', title:'Country codes',
    say:`Country codes came in as "my ", " IN", "sg"… I need clean capitals like MY, IN, SG.`,
    q:`In <b>H2</b>, remove any extra spaces from E2 <i>and</i> turn it into capitals, in one formula.`,
    target:'H2:H7', ref:'=UPPER(TRIM(E2))', cs:true,
    lesson:`Nesting does both jobs at once: TRIM removes the spaces, then UPPER capitalises what's left. The order doesn't change the result here, so <code>=TRIM(UPPER(E2))</code> works too.`,
    diag:[
      {re:/^=UPPER\(E2\)$/, msg:`The capitals are right, but "my " and " IN" still have a space (look for the orange dots). Put TRIM inside: UPPER(TRIM(E2)).`},
      {re:/^=TRIM\(E2\)$/, msg:`The spaces are gone, but "my" is still lowercase. Wrap it in UPPER.`},
    ]},
  { type:'mcq', topic:'CONCAT', title:'Where did the spaces go?',
    say:`I tried to build the badge text with =CONCAT(B2,F2,G2) and got something odd.`,
    q:`What does <code>=CONCAT(B2,F2,G2)</code> return for Nadia, and how do you fix it?`,
    opts:[
      {t:`"ProfessorNadiaHASSAN". Add the spaces as their own arguments: =CONCAT(B2," ",F2," ",G2).`, ok:true,
       why:`CONCAT joins exactly what you give it, with nothing in between. A space is text, so it goes inside double quotes as its own argument, between the cells.`},
      {t:`"Professor Nadia HASSAN". CONCAT adds spaces automatically.`,
       why:`CONCAT never adds spaces. You must include them yourself.`},
      {t:`An error. Fix it by typing spaces between the commas: =CONCAT(B2, F2, G2).`,
       why:`Spaces between arguments are ignored. They're just layout in the formula, not text in the result. The space has to be in quotes: " ".`},
      {t:`"Professor, Nadia, HASSAN". Remove the commas to fix it.`,
       why:`The commas separate the arguments; they don't appear in the result. Without them, Excel can't read the formula.`},
    ]},
  { type:'formula', topic:'CONCAT', title:'Badge text',
    say:`Now the badge line itself: title, first name, surname.`,
    q:`In <b>I2</b>, join B2, F2 and G2 with a space between each. Expected for row 2: Professor Nadia HASSAN`,
    target:'I2:I7', ref:'=CONCAT(B2," ",F2," ",G2)', cs:true,
    lesson:`<code>=CONCAT(B2," ",F2," ",G2)</code> joins the cells with a space (in double quotes) between each. <code>=B2&" "&F2&" "&G2</code> gives the same result. You may also meet the older CONCATENATE function, which does the same job.`,
    diag:[
      {re:/CONCAT\(B2,F2,G2\)/, msg:`Without spaces you get "ProfessorNadiaHASSAN". Add " " between the cells.`},
      {re:/C2|D2/, msg:`C2 and D2 still have the messy capitals. Use the cleaned columns F (first name) and G (surname).`},
      {re:/A2/, msg:`A2 is the original full name. Build the badge from the clean parts: B2, F2 and G2.`},
    ]},
  { type:'mcq', topic:'CONCATENATE', title:'CONCAT or CONCATENATE?',
    say:`An old template from last year's summit uses CONCATENATE instead of CONCAT. Is that a problem?`,
    q:`What's the main difference between CONCATENATE and CONCAT?`,
    opts:[
      {t:`CONCATENATE is the older version. It still works, but it only accepts single cells, while CONCAT can also take a range like F2:H2.`, ok:true,
       why:`Both join text the same way, so the old template will keep working. CONCAT, added in Excel 2019, is the newer version and can take ranges. Microsoft keeps CONCATENATE so older files don't break.`},
      {t:`CONCATENATE adds spaces automatically.`,
       why:`Neither function adds spaces. With both, you add " " yourself.`},
      {t:`CONCATENATE only works with numbers.`,
       why:`It joins text and numbers, exactly like CONCAT.`},
      {t:`CONCATENATE has been removed, so old files show #NAME?.`,
       why:`It hasn't been removed. It's still supported for compatibility.`},
    ]},
  { type:'formula', topic:'TEXTJOIN', title:'Welcome slide',
    say:`For the welcome slide I need all the speakers' first names in one line, separated by commas: "Nadia, Aisyah, …"`,
    q:`In <b>B11</b>, use TEXTJOIN to join the clean first names F2:F7 with a comma and a space (", ") between them, skipping any empty cells.`,
    target:'B11', ref:'=TEXTJOIN(", ",TRUE,F2:F7)', cs:true,
    lesson:`<code>TEXTJOIN(delimiter, ignore_empty, text…)</code> puts the delimiter between every item, and it accepts a whole range. With CONCAT you'd have to type ", " between every single cell. TRUE means empty cells are skipped, so you don't get ", ," gaps.`,
    diag:[
      {re:/TEXTJOIN\(",",/, msg:`Close: there's no space after the commas ("Nadia,Aisyah,…"). Use ", " with a space inside the quotes.`},
      {re:/TEXTJOIN\(F2:F7/, msg:`The delimiter comes first, then TRUE or FALSE, then the cells: TEXTJOIN(", ", TRUE, F2:F7).`},
      {re:/C2:C7/, msg:`Column C has the messy capitals ("aisyah"). Use the clean first names in F2:F7.`},
      {re:/^=CONCAT/, msg:`CONCAT doesn't add anything between the items, so you'd get "NadiaAisyahDaniel…". TEXTJOIN adds a delimiter for you.`},
    ]},
  { type:'mcq', topic:'TEXTJOIN', title:'TRUE or FALSE?',
    say:`Suppose Daniel cancels and I clear his first name, F4. What does the second argument of TEXTJOIN change?`,
    q:`With F4 empty, what does <code>=TEXTJOIN(", ",FALSE,F2:F7)</code> return?`,
    opts:[
      {t:`"Nadia, Aisyah, , Priya, Farah, Ahmad", with an empty gap where Daniel was.`, ok:true,
       why:`FALSE means "don't ignore empty cells", so the empty F4 still gets a delimiter on each side. With TRUE, Excel skips it and the list stays clean.`},
      {t:`"Nadia, Aisyah, Priya, Farah, Ahmad"`,
       why:`That's what TRUE gives. With FALSE, empty cells are kept, which leaves a ", ," gap.`},
      {t:`#VALUE!, because a cell is empty.`,
       why:`An empty cell isn't an error. TEXTJOIN either skips it or includes it as an empty item.`},
      {t:`Only "Nadia, Aisyah", because it stops at the first empty cell.`,
       why:`TEXTJOIN goes through the whole range. It never stops at a blank.`},
    ]},
  { type:'mcq', topic:'CONCAT', title:'Badge numbers',
    say:`I made badge numbers with =CONCAT(H2,1001), which gives MY1001. Can I add 1 to it to get the next number?`,
    q:`What type of value does <code>=CONCAT(H2,1001)</code> produce?`,
    opts:[
      {t:`Text. Joining turns the result into text, even though it contains digits, so =I2+1 gives #VALUE!.`, ok:true,
       why:`CONCAT always returns text. That's fine for a label like MY1001, but you can't do maths on it. Keep the number in its own column if you need to calculate with it.`},
      {t:`A number, because it contains 1001.`,
       why:`The digits are part of a text label now. Excel treats the whole result as text.`},
      {t:`A date.`,
       why:`Nothing here is a date. CONCAT always returns text.`},
      {t:`It depends on which cell comes first.`,
       why:`The order doesn't matter. CONCAT always returns text, even if every input is a number.`},
    ]},
  { type:'mcq', topic:'Regional settings', title:'The colleague in Germany',
    say:`Our co-organiser in Berlin typed my formula =LEFT(A2,9) into her Excel and got an error message.`,
    q:`What's the most likely reason?`,
    opts:[
      {t:`Her regional settings use a semicolon to separate arguments, and the German function name, so she needs =LINKS(A2;9).`, ok:true,
       why:`In many European regions, the comma is used for decimals, so Excel separates arguments with a semicolon. Function names can also be translated (LEFT is LINKS in German, SUM is SUMME). Formulas already in a file are converted automatically when it's opened; it's typing them by hand that trips people up.`},
      {t:`LEFT only works in English-speaking countries.`,
       why:`LEFT works everywhere. It may just have a local name and a different separator.`},
      {t:`Her version of Excel can't count past 8 characters.`,
       why:`There's no such limit. The problem is the formula syntax for her region.`},
      {t:`The file has to be saved in German first.`,
       why:`Files don't have a language. Excel converts formulas to the local settings when the file is opened.`},
    ]},
  ]
},
{
  id:'orders', tab:'Orders', company:'Kain & Co.', file:'middle_east_orders.xlsx',
  who:'Hafiz Daud', role:'Operations Lead', ini:'HD',
  story:`We sell batik online, and our Middle East orders ship from a partner warehouse in Riyadh. I need to break down orders by month, rebuild the ship dates from the warehouse's export, and work out how many working days each order took. Careful: in Saudi Arabia the weekend is Friday and Saturday. In this workbook, today is Thursday 1 October 2026.`,
  skills:['How Excel stores dates & times','TODAY & NOW','DAY, MONTH & YEAR','DATE','NETWORKDAYS.INTL','DATEDIF'],
  cells: sheet([
    ['Order','Order date','Month','Year','','Ship year','Ship month','Ship day','Ship date','Working days'],
    ['KC-1041',D('2026-07-12'),'','','',2026,7,16],
    ['KC-1042',D('2026-08-01'),'','','',2026,8,5],
    ['KC-1043',D('2026-08-19'),'','','',2026,8,24],
    ['KC-1044',D('2026-09-06'),'','','',2026,9,8],
    ['KC-1045',D('2026-09-12'),'','','',2026,9,17],
    ['KC-1046',D('2026-09-24'),'','','',2026,9,29],
  ], {B:'date',C:'int',I:'date',J:'int'}),
  tasks:[
  { type:'mcq', topic:'How Excel stores dates', title:'The mystery number',
    say:`I accidentally changed a cell holding today's date to the General format, and it now shows 46296. Did I break it?`,
    q:`Why does 1 October 2026 show as 46296?`,
    opts:[
      {t:`Excel stores every date as a serial number: the count of days since 1 January 1900 (day 1). Formatting only changes how it's displayed.`, ok:true,
       why:`1 October 2026 is day 46,296 in Excel's calendar. Because dates are numbers, you can subtract one from another to get the days between them, or add 7 to move a week ahead. Apply a Date format again and it shows as a date.`},
      {t:`The date was corrupted and must be retyped.`,
       why:`Nothing is broken. The value is exactly the same; only the display format changed.`},
      {t:`It's the number of seconds since the year 2000.`,
       why:`Excel counts days, not seconds, and it starts from 1 January 1900.`},
      {t:`It's a random ID Excel gives each cell.`,
       why:`It's not random: each day is one higher than the day before.`},
    ]},
  { type:'mcq', topic:'How Excel stores times', title:'What time is 0.75?',
    say:`A delivery time cell shows 0.75 in General format. What time is that?`,
    q:`Excel stores times as fractions of a day. What time is 0.75?`,
    opts:[
      {t:`6:00 PM (18:00)`, ok:true,
       why:`A whole day is 1, so 0.5 is noon and 0.75 is three quarters of the way through the day: 18 of 24 hours.`},
      {t:`7:30 AM`,
       why:`That would treat 0.75 like clock digits. Times are fractions of 24 hours, so 0.75 × 24 = 18:00.`},
      {t:`0:75, which isn't a valid time`,
       why:`0.75 isn't hours and minutes. It's a fraction of a whole day.`},
      {t:`75 minutes after midnight`,
       why:`75 minutes would be 75 ÷ 1,440 ≈ 0.052. 0.75 is 18 hours.`},
    ]},
  { type:'mcq', topic:'TODAY & NOW', title:'Last refreshed',
    say:`I want a cell at the top of the report that shows the date <b>and</b> time the figures were last recalculated.`,
    q:`Which entry does that?`,
    opts:[
      {t:`<code>=NOW()</code>`, ok:true,
       why:`NOW returns the current date and time and updates every time the sheet recalculates (press F9, or ⌘ + = on a Mac, to refresh it). Like TODAY, it takes no arguments, but the empty brackets are still required.`},
      {t:`<code>=TODAY()</code>`,
       why:`TODAY gives only the date, without the time.`},
      {t:`Press Ctrl + ;`,
       why:`That types today's date as a fixed value. It never updates and has no time.`},
      {t:`<code>=NOW</code>`,
       why:`Without the brackets, Excel looks for a name called NOW and shows #NAME?. Functions without arguments still need ().`},
    ]},
  { type:'formula', topic:'MONTH', title:'Orders by month',
    say:`To total orders per month, I first need the month number of each order.`,
    q:`In <b>C2</b>, extract the month number from the order date in B2.`,
    target:'C2:C7', ref:'=MONTH(B2)', fmt:'int',
    lesson:`<code>MONTH(date)</code> returns 1–12. Now you can sort or filter by month, or total August orders with SUMIF. <code>DAY(date)</code> returns the day of the month in the same way.`,
    diag:[
      {re:/DAY\(/, msg:`DAY returns the day of the month (12, 1, 19…). For the month number, use MONTH.`},
      {re:/YEAR\(/, msg:`YEAR returns 2026. For the month, use MONTH.`},
      {re:/TEXT\(/, msg:`TEXT returns a month name as text. Here you want the number, from MONTH(B2).`},
    ]},
  { type:'formula', topic:'YEAR', title:'Orders by year',
    say:`And the year, so this sheet still works when 2027 orders arrive.`,
    q:`In <b>D2</b>, extract the year from B2.`,
    target:'D2:D7', ref:'=YEAR(B2)',
    lesson:`<code>YEAR(date)</code> returns the four-digit year. With Month and Year in their own columns, you can filter "all orders in August 2026" with two simple filters.`,
    diag:[ {re:/MONTH\(|DAY\(/, msg:`That returns a different part of the date. For the year, use YEAR(B2).`} ]},
  { type:'formula', topic:'DATE', title:'Rebuild the ship date',
    say:`The warehouse sends year, month and day in three separate columns. I need one real date I can calculate with.`,
    q:`In <b>I2</b>, combine the year (F2), month (G2) and day (H2) into one date.`,
    target:'I2:I7', ref:'=DATE(F2,G2,H2)', fmt:'date',
    lesson:`<code>DATE(year, month, day)</code> always takes the parts in that order, whatever your regional date format is. Unlike joining with CONCAT, the result is a real date (a serial number), so you can subtract it from other dates or use it in NETWORKDAYS.`,
    diag:[
      {re:/DATE\(H2,G2,F2\)/, msg:`The order matters: DATE always takes year, month, day. Use DATE(F2, G2, H2).`},
      {re:/DATE\(F2,H2,G2\)/, msg:`Month and day are swapped. DATE takes year, then month, then day.`},
      {re:/CONCAT|&/, msg:`Joining the parts gives text like "2026716", not a date. You couldn't calculate with it. DATE builds a real date.`},
    ]},
  { type:'formula', topic:'NETWORKDAYS.INTL', title:'Working days in Riyadh',
    say:`How many working days did the warehouse take, from order date to ship date? Remember, their weekend is Friday and Saturday.`,
    q:`In <b>J2</b>, count working days from B2 to I2 with a Friday–Saturday weekend. Tip: in NETWORKDAYS.INTL, weekend code <b>7</b> means Friday and Saturday.`,
    target:'J2:J7', ref:'=NETWORKDAYS.INTL(B2,I2,7)', fmt:'int',
    lesson:`<code>NETWORKDAYS.INTL(start, end, weekend, holidays)</code> lets you choose the weekend. Code 1 is Saturday–Sunday (the default), 7 is Friday–Saturday, and 11–17 mean a single day off. You can also write a 7-character pattern starting Monday, so "0000110" is also Friday–Saturday. Neither version knows about public holidays; add a holiday list as the fourth argument.`,
    diag:[
      {re:/^=NETWORKDAYS\(B2,I2\)$/, msg:`Plain NETWORKDAYS uses a Saturday–Sunday weekend, so it counts Fridays as working days and Sundays as days off. For Riyadh, use NETWORKDAYS.INTL with weekend code 7.`},
      {re:/INTL\(B2,I2\)$|INTL\(B2,I2,1\)/, msg:`Without a weekend code (or with 1), NETWORKDAYS.INTL assumes Saturday–Sunday. Add 7 for Friday–Saturday.`},
      {re:/INTL\(I2,B2/, msg:`The dates are the wrong way round, so you get a negative number. Start date first: B2, then I2.`},
      {re:/^=I2-B2$/, msg:`Subtracting dates counts every calendar day, weekends included. Use NETWORKDAYS.INTL to count only working days.`},
    ]},
  { type:'mcq', topic:'NETWORKDAYS', title:'What about public holidays?',
    say:`Saudi National Day is 23 September, and the warehouse was closed. Does NETWORKDAYS.INTL know that?`,
    q:`How do you make NETWORKDAYS or NETWORKDAYS.INTL skip public holidays?`,
    opts:[
      {t:`List the holiday dates in a range and add it as the last argument, e.g. =NETWORKDAYS.INTL(B2,I2,7,L2:L10).`, ok:true,
       why:`Neither function has holidays built in. They only skip the dates you give them, so keep a holiday table in the workbook and point to it.`},
      {t:`Nothing: Excel knows every country's public holidays.`,
       why:`Excel has no built-in holiday calendar. Without a list, holidays count as working days.`},
      {t:`Change the weekend code to 8.`,
       why:`Weekend codes only set which weekdays are off every week. They can't mark single dates. 8 isn't a valid code either.`},
      {t:`Subtract 1 from every result.`,
       why:`That's wrong for orders whose dates don't include the holiday. A holiday list only removes it where it actually falls.`},
    ]},
  { type:'mcq', topic:'DATEDIF', title:'The hidden function',
    say:`I typed =DATEDIF( to work out how long each customer has been with us, but no help box popped up, and Insert Function can't find it. Is it broken?`,
    q:`Why doesn't DATEDIF show any help?`,
    opts:[
      {t:`It's a legacy function: still supported, but hidden from autocomplete and Insert Function. Type it in full: =DATEDIF(start, end, "y").`, ok:true,
       why:`DATEDIF survives from older spreadsheet programs for compatibility. It works, but Excel doesn't advertise it, and Microsoft warns that some results (like the "md" unit) can be unreliable. "y", "m" and "d" give complete years, months and days.`},
      {t:`It only works on a Mac.`,
       why:`It works on Windows and Mac. It's hidden on both.`},
      {t:`It was removed from Excel, so the formula will show #NAME?.`,
       why:`It hasn't been removed. Typed correctly, it returns a result.`},
      {t:`It needs an add-in to be installed first.`,
       why:`No add-in is needed. It's built in, just not listed.`},
    ]},
  { type:'mcq', topic:'How Excel stores dates', title:'Four years and a day',
    say:`A supplier sent an old file made on an early Mac version of Excel. When I copy their dates into my workbook, every one is 4 years and 1 day out.`,
    q:`What's the most likely cause?`,
    opts:[
      {t:`Their file uses the 1904 date system (day 1 = 1 January 1904), while mine uses the 1900 system.`, ok:true,
       why:`Excel for Mac before 2011 started counting from 1904. The same serial number is then 1,462 days (4 years and 1 day) apart between the two systems. Check File > Options > Advanced > "Use 1904 date system" and make both workbooks match before copying.`},
      {t:`The dates were typed in the wrong regional format.`,
       why:`A day/month mix-up would swap days and months, not shift every date by exactly 4 years and 1 day.`},
      {t:`Leap years were not counted.`,
       why:`Excel counts leap years in both systems. The shift comes from the different starting point.`},
      {t:`The supplier's computer clock was wrong.`,
       why:`The system clock affects TODAY and NOW, not dates already stored in the file.`},
    ]},
  ]
},
{
  id:'quote', tab:'Quote', company:'Rimba Outdoor Supply', file:'gunung_gear_quote.xlsx',
  who:'Danial Yusof', role:'Sales Executive', ini:'DY',
  story:`I'm meeting Gunung Gear, one of our biggest retail customers, tomorrow. Their last order is in this sheet, but I still need the discounts, delivery charges, final totals and a summary by delivery zone. Our rules: orders <b>over</b> $10,000 get 10% off, and delivery depends on the zone. Customers who pick up from our warehouse pay no delivery.`,
  skills:['Logical operators','IF','IFS & nested IF','AND & OR','SUMIF','COUNTIF','AVERAGEIF'],
  cells: (()=>{
    const c={};
    const put=(a,v,fmt,h)=>{ c[a]={v}; if(fmt) c[a].fmt=fmt; if(h) c[a].h=true; };
    put('A1','Zone',0,1); put('B1','Delivery charge',0,1);
    [['North',25],['Central',15],['South',30]].forEach(([z,v],i)=>{ put('A'+(i+2),z,0,1); put('B'+(i+2),v,'money'); });
    put('D1','Zone',0,1); put('E1','Sales total',0,1); put('F1','Orders',0,1); put('G1','Average order',0,1);
    ['North','Central','South'].forEach((z,i)=>put('D'+(i+2),z,0,1));
    ['Item','Unit price','Qty','Subtotal','Discount','Total','Zone','Delivery','Total + delivery'].forEach((h,i)=>put(colStr(i+1)+'6',h,0,1));
    [['Backpack 60L',320,45,'Central'],['Camping stove',250,40,'South'],['Tent (4-person)',420,30,'North'],['Sleeping bag',150,40,'Central'],
     ['Headlamp',45,120,'North'],['Water filter',180,25,'Pickup'],['Folding chair',85,60,'South'],['Trekking poles',110,100,'North']].forEach(([it,p,q,z],i)=>{
      const r=i+7; put('A'+r,it); put('B'+r,p,'money'); put('C'+r,q,'int'); put('D'+r,p*q,'money'); put('G'+r,z); });
    return c; })(),
  tasks:[
  { type:'mcq', topic:'Logical operators', title:'Not equal to',
    say:`Before we start: I want a test that is TRUE for every order that is <b>not</b> a warehouse pickup.`,
    q:`Which logical test is TRUE when the zone in G7 is anything except "Pickup"?`,
    opts:[
      {t:`<code>G7&lt;&gt;"Pickup"</code>`, ok:true,
       why:`In Excel, "not equal to" is a less-than sign followed by a greater-than sign: &lt;&gt;. The other comparison operators are =, &gt;, &lt;, &gt;= and &lt;=. Text in a test always goes in double quotes.`},
      {t:`<code>G7!="Pickup"</code>`,
       why:`!= means "not equal" in many programming languages, but Excel doesn't accept it and rejects the formula.`},
      {t:`<code>G7&gt;&lt;"Pickup"</code>`,
       why:`The order matters: Excel only understands &lt;&gt;. The reversed &gt;&lt; isn't an operator.`},
      {t:`<code>G7=NOT"Pickup"</code>`,
       why:`NOT is a function that needs brackets, such as NOT(G7="Pickup"). Written like this, Excel can't read it.`},
    ]},
  { type:'formula', topic:'IF', title:'Who gets 10% off?',
    say:`Orders over $10,000 get a 10% discount. Everything else gets 0.`,
    q:`In <b>E7</b>, use IF: if the subtotal in D7 is <b>over</b> 10,000, show 10%; otherwise show 0. It fills down to E14.`,
    target:'E7:E14', ref:'=IF(D7>10000,10%,0)', fmt:'pct',
    lesson:`<code>IF(test, value if true, value if false)</code>. The test <code>D7&gt;10000</code> is FALSE for the camping stove at exactly $10,000, because "over" means &gt;, not &gt;=. 10% is typed without quotes, so Excel stores it as the number 0.1 and you can calculate with it. <code>0.1</code> works too.`,
    diag:[
      {re:/D7>=10000/, msg:`Look at the camping stove: exactly $10,000. "Over $10,000" means more than, so use > rather than >=.`},
      {re:/"10%"/, msg:`With quotes, "10%" is text, and you can't multiply a price by text. Type 10% without quotes so it's a number.`},
      {re:/D7<10000/, msg:`Check which way round it is: when D7<10000 is TRUE, the discount should be 0, so 0 must be the second argument.`},
    ]},
  { type:'mcq', topic:'IF', title:'Quotes or no quotes?',
    say:`My colleague always puts quotes around the results of an IF. Why didn't we use quotes for 10%?`,
    q:`What goes wrong with <code>=IF(D7&gt;10000,"10%",0)</code>?`,
    opts:[
      {t:`"10%" becomes text. It looks right, but formulas that multiply by it return #VALUE!.`, ok:true,
       why:`Quotes tell Excel "this is text". Use them for words like "Bonus", but leave numbers, percentages and cell references without quotes so they can be calculated with.`},
      {t:`Nothing. Quotes are optional.`,
       why:`They change the data type. With quotes, the result is text, not a number.`},
      {t:`The formula shows #NAME?.`,
       why:`The formula is valid. It just returns text instead of a number, so the problem only shows up later, in calculations.`},
      {t:`It shows 1000% instead of 10%.`,
       why:`It shows exactly "10%" as typed. The problem is that it's text.`},
    ]},
  { type:'formula', topic:'Formulas', title:'Total after discount',
    say:`Now the total for each line, after the discount.`,
    q:`In <b>F7</b>, calculate the subtotal D7 minus its discount: subtotal × (1 − discount).`,
    target:'F7:F14', ref:'=D7*(1-E7)', fmt:'money',
    lesson:`<code>=D7*(1-E7)</code> keeps 90% of the subtotal when the discount is 10%, and 100% when it's 0. <code>=D7-D7*E7</code> gives the same result.`,
    diag:[
      {re:/^=D7\*E7$/, msg:`That's the discount amount itself ($1,440 for the backpacks), not the total after the discount.`},
      {re:/^=D7-E7$/, msg:`E7 is 10%, i.e. 0.1, so this takes off 10 cents, not 10%. Multiply: D7*(1-E7).`},
      {re:/^=D7\*1-E7$/, msg:`Multiplication happens before subtraction, so this is D7 − 0.1. Put 1-E7 in brackets.`},
    ]},
  { type:'formula', topic:'IFS', title:'Delivery by zone',
    say:`Delivery depends on the zone: the charges are in B2:B4. Pickup, or any other zone, pays 0.`,
    q:`In <b>H7</b>, use IFS to look at the zone in G7 and return the matching charge from B2, B3 or B4, or 0 for anything else. Lock the charge cells with $ so the formula fills down to H14.`,
    target:'H7:H14', ref:'=IFS(G7="North",$B$2,G7="Central",$B$3,G7="South",$B$4,TRUE,0)', fmt:'money',
    lesson:`Each pair in IFS is a test and its result. Text such as "North" needs double quotes. The final <code>TRUE,0</code> catches every other zone (like Pickup), so you get 0 instead of #N/A. The $ signs keep B2, B3 and B4 fixed when the formula is copied down.`,
    diag:[
      {re:/G7=North|G7=Central|G7=South/, msg:`Zone names are text, so they need double quotes: G7="North". Without quotes, Excel looks for something named North and shows #NAME?.`},
      {re:/^=IFS\((?!.*TRUE).*\)$/, msg:`The water filter is a Pickup order, so none of your tests match and IFS returns #N/A. Add TRUE,0 at the end as a catch-all.`},
      {re:/(^|[^$])B2[^0-9]|(^|[^$])B3[^0-9]|(^|[^$])B4[^0-9]/, msg:`Row 7 works, but when you fill down, B2 becomes B3, B4… and the charges shift. Lock them: $B$2, $B$3, $B$4.`},
    ]},
  { type:'mcq', topic:'Nested IF', title:'The nested IF version',
    say:`Our old spreadsheets use nested IFs instead of IFS. What would the same delivery formula look like?`,
    q:`Which nested IF gives the same result as the IFS formula?`,
    opts:[
      {t:`<code>=IF(G7="North",$B$2,IF(G7="Central",$B$3,IF(G7="South",$B$4,0)))</code>`, ok:true,
       why:`Each new IF goes in the "value if false" position of the one before, so Excel only tries the next test when the previous one fails. Every IF needs its own closing bracket, which is why there are three at the end. The last 0 does the same job as TRUE,0 in IFS.`},
      {t:`<code>=IF(G7="North",$B$2,IF(G7="Central",$B$3,IF(G7="South",$B$4,0)</code>`,
       why:`There are three IFs but only one closing bracket. Each IF needs its own, so Excel will report a missing bracket.`},
      {t:`<code>=IF(G7="North",$B$2,=IF(G7="Central",$B$3,=IF(G7="South",$B$4,0)))</code>`,
       why:`Only the start of the whole formula needs =. Nested functions are written without one.`},
      {t:`<code>=IF(AND(G7="North",G7="Central",G7="South"),$B$2,0)</code>`,
       why:`A zone can't be North AND Central AND South at the same time, so this is always FALSE. It also returns only one charge.`},

  { type:'mcq', topic:'AND & OR', title:'All or any?',

      {t:`OR returns FALSE; AND would return TRUE.`,
       why:`That's the wrong way round. OR is the forgiving one: any single TRUE is enough.`},

    diag:[

      {re:/"North"/, msg:`Typing "North" works in E2, but when you fill down, every row still says North. Point to the zone name in D2 instead.`},
      {re:/\$D\$7:\$D\$14|D7:D14/, msg:`D7:D14 is the subtotal before discount. Use the totals after discount in F7:F14.`},
      {re:/SUMIF\(\$?F\$?7:\$?F\$?14,\$?D/, msg:`The order is: range to check (the zones in G), then the criteria (D2), then the range to add (F).`},
    ]},
  { type:'formula', topic:'COUNTIF', title:'Orders per zone',
    say:`How many order lines went to each zone?`,
    q:`In <b>F2</b>, count how many zones in G7:G14 match D2. Lock the range with $.`,
    target:'F2:F4', ref:'=COUNTIF($G$7:$G$14,D2)', fmt:'int',
    lesson:`<code>COUNTIF(range, criteria)</code> needs only two arguments, because it counts matches instead of adding values. North appears 3 times, Central twice, South twice.`,
    diag:[
      {re:/COUNTIF\(G7:G14/, msg:`Right for F2, but the range slides down as you fill. Lock it: $G$7:$G$14.`},
      {re:/^=COUNT\(/, msg:`COUNT counts cells that contain numbers. Zones are text, and you only want the matches: COUNTIF.`},
      {re:/SUMIF/, msg:`SUMIF adds values. To count matching rows, use COUNTIF.`},
    ]},
  { type:'formula', topic:'AVERAGEIF', title:'Average order per zone',
    say:`And the average order value per zone.`,
    q:`In <b>G2</b>, use AVERAGEIF to average the totals F7:F14 for the zone in D2. Lock the ranges.`,
    target:'G2:G4', ref:'=AVERAGEIF($G$7:$G$14,D2,$F$7:$F$14)', fmt:'money',
    lesson:`AVERAGEIF takes the same three arguments as SUMIF, but returns the average of the matching rows. You could also divide your SUMIF result by your COUNTIF result (E2/F2) and get the same answer.`,
    diag:[
      {re:/AVERAGEIF\(G7:G14/, msg:`Right for G2, but lock the ranges with $ so they don't slide when filled down.`},
      {re:/^=AVERAGE\(/, msg:`AVERAGE uses every row. You need only the rows for the zone in D2: AVERAGEIF.`},
    ]},
  { type:'mcq', topic:'COUNTIF', title:'Capital letters',
    say:`A colleague typed =COUNTIF(G7:G14,"NORTH") in capitals. Will it miss the rows that say "North"?`,
    q:`What does <code>=COUNTIF(G7:G14,"NORTH")</code> return?`,
    opts:[
      {t:`3. Text criteria in COUNTIF, SUMIF and AVERAGEIF ignore upper and lower case.`, ok:true,
       why:`"NORTH", "North" and "north" all match. Extra spaces are a different story: "North " with a trailing space would not match, which is why cleaning data with TRIM first matters.`},
      {t:`0, because the capitals don't match.`,
       why:`These functions aren't case-sensitive, so capitals don't matter.`},
      {t:`#VALUE!`,
       why:`The formula is valid. Upper-case criteria are fine.`},
      {t:`8, because it counts every row.`,
       why:`It only counts cells that match the criteria: the three North rows.`},
    ]},
  { type:'mcq', topic:'SUMIF', title:'Big orders only',
    say:`Last question for the meeting: how much did Gunung Gear spend on lines whose total was over $10,000?`,
    q:`Which formula adds up only the totals in F7:F14 that are greater than 10,000?`,
    opts:[
      {t:`<code>=SUMIF(F7:F14,"&gt;10000")</code>`, ok:true,
       why:`Criteria with an operator go inside quotes. When the range you check is also the range you add, you can leave out the third argument. The result here is $24,300 (the backpacks and the tents).`},
      {t:`<code>=SUMIF(F7:F14,&gt;10000)</code>`,
       why:`Without quotes, Excel can't read >10000 as an argument. Criteria with an operator must be in quotes.`},
      {t:`<code>=SUM(F7:F14&gt;10000)</code>`,
       why:`This compares the range to 10,000 rather than adding the matching values. SUMIF is the function that adds only the matches.`},
      {t:`<code>=COUNTIF(F7:F14,"&gt;10000")</code>`,
       why:`COUNTIF tells you how many lines are over $10,000 (2), not their total.`},
    ]},
  ]

/* ================= STATE ================= */
const PTS=[100,60,30,0];
const TOTAL_TASKS = SITS.reduce((s,x)=>s+x.tasks.length,0);
const MAXPTS = TOTAL_TASKS*100;
const RANKS = [[0,'Intern'],[40,'Junior Analyst'],[60,'Data Analyst'],[75,'Senior Analyst'],[90,'Lead Analyst']];
const rankFor = pct => RANKS.filter(r=>pct>=r[0]).pop()[1];
const newState = () => ({screen:'welcome', s:0, t:0, res:{}, drafts:{}, ui:{}});
let state = newState();
try{
  let saved=JSON.parse(localStorage.getItem('ledger-line-v5')||'null'); const fromOld=!saved;
  if(!saved) saved=JSON.parse(localStorage.getItem('ledger-line-v4')||'null');
  if(!saved){ const v3=JSON.parse(localStorage.getItem('ledger-line-v3')||'null');
    if(v3 && v3.res){ const sm=b=> b<=5?b : b<=10?b+3 : b+6;
      const mv=o=>{ const n={}; for(const [k,v] of Object.entries(o||{})){ const [a,b]=k.split('-').map(Number); n[a===5?`6-${b}` : a===4?`4-${sm(b)}` : k]=v; } return n; };
      v3.res=mv(v3.res); v3.drafts=mv(v3.drafts); if(v3.s===5) v3.s=6; else if(v3.s===4) v3.t=sm(v3.t); saved=v3; } }
  if(!saved){ const v2=JSON.parse(localStorage.getItem('ledger-line-v2')||'null');
    if(v2 && v2.res){ const mv=o=>{ const n={}; for(const [k,v] of Object.entries(o||{})){ const [a,b]=k.split('-').map(Number); n[a===4?`5-${b}`:k]=v; } return n; };
      const mv2=o=>{ const n={}; for(const [k,v] of Object.entries(o||{})){ const [a,b]=k.split('-').map(Number); n[a===4?`6-${b}`:k]=v; } return n; };
      v2.res=mv2(v2.res); v2.drafts=mv2(v2.drafts); if(v2.s===4) v2.s=6; saved=v2; } }
  if(!saved){ const old=JSON.parse(localStorage.getItem('ledger-line-v1')||'null');
    if(old && old.res){ const mv=o=>{ const n={}; for(const [k,v] of Object.entries(o||{})){ const [a,b]=k.split('-').map(Number); n[a===1&&b>=7 ? `1-${b+6}` : k]=v; } return n; };
      const fin=o=>{ const n={}; for(const [k,v] of Object.entries(o||{})){ const [a,b]=k.split('-').map(Number); n[a===4?`6-${b}`:k]=v; } return n; };
      old.res=fin(mv(old.res)); old.drafts=fin(mv(old.drafts)); if(old.s===1&&old.t>=7) old.t+=6; if(old.s===4) old.s=6; saved=old; } }
  if(fromOld && saved && saved.res){ const mv=o=>{ const n={}; for(const [k,v] of Object.entries(o||{})){ const [a,b]=k.split('-').map(Number); n[a===6?`7-${b}`:k]=v; } return n; };
    saved.res=mv(saved.res); saved.drafts=mv(saved.drafts); if(saved.s===6) saved.s=7; }
  if(saved && saved.res) state=Object.assign(newState(),saved);
}catch(e){}
const save = () => { try{ localStorage.setItem('ledger-line-v5', JSON.stringify(state)); }catch(e){} };

const key = (s,t) => `${s}-${t}`;
const R = (s,t) => state.res[key(s,t)] || (state.res[key(s,t)]={wrong:0,done:false,pts:0,picks:[],revealed:false});
const score = () => Object.values(state.res).reduce((a,r)=>a+(r.done?r.pts:0),0);
const sitScore = s => SITS[s].tasks.reduce((a,_,t)=>{ const r=state.res[key(s,t)]; return a+(r&&r.done?r.pts:0); },0);
const sitDone = s => SITS[s].tasks.filter((_,t)=>{ const r=state.res[key(s,t)]; return r&&r.done; }).length;
const starsFor = (pts,max) => { const p=pts/max*100; return p>=90?3:p>=70?2:p>=40?1:0; };
const starStr = n => '★'.repeat(n)+'☆'.repeat(3-n);

/* sheet as it stands at task t (earlier answers filled in) */
function cellsFor(s,t){
  const sit=SITS[s], cells=JSON.parse(JSON.stringify(sit.cells));
  for(let i=0;i<t;i++){
    const tk=sit.tasks[i];
    if(tk.type!=='formula') continue;
    expandTarget(tk.target).forEach((a,k)=>{ cells[a]=Object.assign(cells[a]||{}, {f:shiftFormula(tk.ref,k), fmt:tk.fmt}); });
  }
  const tk=sit.tasks[t];
  if(tk && tk.prefill) for(const [a,f] of Object.entries(tk.prefill)) cells[a]=Object.assign(cells[a]||{}, {f});
  return cells;
}

/* ================= CHECKING ================= */
const ERR_EXPLAIN = {
  '#NAME?':`Excel doesn't recognise a name in your formula. Check the function spelling, and put any text (like "Bonus") inside double quotes.`,
  '#VALUE!':`One of the values is the wrong type, for example maths on text, or MID with a start below 1.`,
  '#DIV/0!':`Your formula divides by zero or by an empty cell. Check the cell after the /.`,
  '#N/A':`None of the conditions matched, so IFS had nothing to return. Add TRUE,"…" at the end as a catch-all.`,
  '#CIRC!':`The formula refers to its own cell, directly or through a range (a circular reference). Point only to the input cells.`,
  '#NUM!':`The numbers don't work for this function. For DATEDIF, the start date must come before the end date, and the unit must be "Y", "M" or "D".`,
  '#ARGS':`A function has the wrong number of arguments. Check what goes inside the brackets, separated by commas.`,
  '#SPILL!':`The result needs more than one cell, but a cell it would spill into isn't empty. Clear the cells to the right.`,
  '#SYNTAX':`One of the cells your formula uses has a broken formula.`,
};

function same(a,b,tk){
  if(isErr(a)||isErr(b)) return isErr(a)&&isErr(b)&&a.e===b.e;
  if(typeof b==='number'){
    if(tk.loose && typeof a==='string' && a.trim()!=='' && !isNaN(+a)) a=+a;
    if(typeof a!=='number') return false;
    return Math.abs(a-b) <= 1e-6*Math.max(1,Math.abs(b));
  }
  if(typeof b==='string'){
    if(tk.loose && typeof a==='number') a=String(a);
    if(typeof a!=='string') return false;
    return tk.cs ? a===b : a.toLowerCase()===b.toLowerCase();
  }
  return a===b;
}

function runFormula(s,t,formula){
  const tk=SITS[s].tasks[t], base=cellsFor(s,t), addrs=expandTarget(tk.target);
  const u=JSON.parse(JSON.stringify(base)), e=JSON.parse(JSON.stringify(base));
  addrs.forEach((a,k)=>{ u[a]=Object.assign({},u[a]||{}, {f:shiftFormula(formula,k), fmt:tk.fmt}); e[a]=Object.assign({},e[a]||{}, {f:shiftFormula(tk.ref,k), fmt:tk.fmt}); delete u[a].v; delete e[a].v; });
  const ub=new Book(u), eb=new Book(e);
  return addrs.concat(tk.spillCells||[]).map(a=>({a, got:ub.get(a), exp:eb.get(a)}));
}

function checkFormula(s,t,raw){
  const tk=SITS[s].tasks[t];
  let f=raw.trim();
  if(!f) return {kind:'syntax', msg:`Type a formula first.`};
  if(/[“”„]/.test(f)) return {kind:'syntax', msg:`Your formula has curly quotes (“ ”). Excel needs straight double quotes ("). Curly quotes often sneak in when you copy a formula from Word or a web page.`};
  if(f[0]!=='=') return {kind:'syntax', msg:`Without = at the start, Excel stores what you typed as plain text and calculates nothing. Every formula starts with =.`};
  try{ parse(f.slice(1)); } catch(x){ if(x instanceof SynErr) return {kind:'syntax', msg:`Excel would reject this formula. ${x.msg}`}; throw x; }
  const rows=runFormula(s,t,f), n=norm(f);
  const okAll=rows.every(r=>same(r.got,r.exp,tk));
  const first=rows.find(r=>!same(r.got,r.exp,tk));
  const cmp = first ? `In ${first.a} your formula gives ${plain(first.got,tk.fmt)}; the expected result is ${plain(first.exp,tk.fmt)}.` : '';
  if(okAll){
    if(!hasRef(f)) return {kind:'wrong', rows, msg:`That's the right number, but it's typed in rather than calculated. If the data changes, this cell won't update. Build it from cell references.`};
    if(tk.mustUse && !n.includes(tk.mustUse+'(')) return {kind:'wrong', rows, msg:tk.mustUseMsg};
    if(tk.mustRef && !new RegExp('\\$?'+tk.mustRef.replace(/(\d+)/,'\\$?$1')).test(n)) return {kind:'wrong', rows, msg:tk.mustRefMsg};
    return {kind:'right', rows};
  }
  if(tk.mustRef && !new RegExp('\\$?'+tk.mustRef.replace(/(\d+)/,'\\$?$1')).test(n) && rows[0] && same(rows[0].got,rows[0].exp,tk)) return {kind:'wrong', rows, msg:tk.mustRefMsg, cmp};
  for(const d of (tk.diag||[])) if(d.re.test(n)) return {kind:'wrong', rows, msg:d.msg, cmp};
  const errRow=rows.find(r=>isErr(r.got));
  if(errRow) return {kind:'wrong', rows, msg:`${errRow.a} shows ${fmtVal(errRow.got)}. ${ERR_EXPLAIN[errRow.got.e]||''}`, cmp};
  if(rows.length>1 && same(rows[0].got,rows[0].exp,tk)) return {kind:'wrong', rows, msg:`Row ${splitAddr(rows[0].a).r} is right, but the rows below aren't. When the formula is filled down, every reference without $ moves down a row. Check whether one of your references should stay fixed ($), or whether a cell is pointing at the wrong column.`, cmp};
  const g=first.got, x=first.exp;
  if(typeof g==='string'&&typeof x==='string'){
    if(g.toLowerCase()===x.toLowerCase()) return {kind:'wrong', rows, msg:`The letters are right but the capitals aren't. Check which case function you need: PROPER, UPPER or LOWER.`, cmp};
    if(g.replace(/\s/g,'')===x.replace(/\s/g,'')) return {kind:'wrong', rows, msg:`The text is nearly right but the spaces are off. Look for extra spaces (TRIM removes them) or a missing " " between pieces.`, cmp};
  }
  if(typeof g==='number'&&typeof x==='number'){
    if(Math.abs(g-x*100)<1e-6*Math.max(1,Math.abs(x*100))) return {kind:'wrong', rows, msg:`Your answer is 100 times too big. The cell is formatted as a percentage, which multiplies by 100 for display, so leave out *100.`, cmp};
    if(Math.abs(g+x)<1e-9 && x!==0) return {kind:'wrong', rows, msg:`Right size, wrong sign. Check the order of the subtraction (new − old).`, cmp};
  }
  return {kind:'wrong', rows, msg:`Not quite. Re-read the task and check which cells your formula uses.`, cmp};
}
